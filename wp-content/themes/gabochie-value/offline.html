<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — Gabochie Design</title>
<meta name="theme-color" content="#072E28">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  body{background:#072E28;color:#FAF7F2;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;}
  .wrap{max-width:520px;display:flex;flex-direction:column;gap:1.25rem;align-items:center;}
  svg.logo{width:72px;height:72px;filter:drop-shadow(0 10px 30px rgba(201,169,110,0.25));}
  h1{font-size:1.6rem;letter-spacing:0.02em}
  p{color:rgba(250,247,242,0.7)}
  button{margin-top:0.5rem;background:var(--gold,#C9A96E);color:#072E28;border:none;padding:0.8rem 1.8rem;border-radius:999px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;font-size:0.75rem;cursor:pointer}
  :root{--gold:#C9A96E}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="logo" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="26,4 47,15 47,37 26,48 5,37 5,15" fill="#072E28" stroke="#C9A96E" stroke-width="2"/><text x="26" y="29" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#C9A96E">GD</text></svg>
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. You can retry below or check your network.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
