name: Configure SSH
description: Install the deploy key and pinned host keys for the runner.

inputs:
  private-key:
    description: OpenSSH private key for the deploy user (no passphrase).
    required: true
  known-hosts:
    description: Full known_hosts line. When empty, host keys are fetched with ssh-keyscan.
    required: false

runs:
  using: composite
  steps:
    - name: Write key and known_hosts
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        else
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST:?DEPLOY_HOST is required}" >> ~/.ssh/known_hosts 2>/dev/null
        fi
        chmod 600 ~/.ssh/known_hosts
