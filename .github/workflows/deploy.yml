name: Deploy to Live

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.gabochiedesign.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./
          exclude: |
            .git/
            .github/
            wp-config.php
            wp-content/uploads/
            wp-content/cache/
            node_modules/
            .env
            local-xdebuginfo.php
            llms.txt
